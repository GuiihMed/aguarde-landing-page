<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>WDCOM | Página de Aguarde Interativa para Sites e Eventos</title>
  <meta name="title" content="WDCOM | Página de Aguarde Interativa para Sites e Eventos">
  <meta name="description" content="Página de aguarde interativa, moderna e personalizada para lançamentos de sites, marcas e grandes eventos. Desenvolvido por WDCOM Mídia Digital.">
  <meta name="keywords" content="WDCOM, Mídia Digital, Página de Aguarde, Em Breve, Landing Page, Eventos, Sites">
  <meta name="author" content="WDCOM Mídia Digital">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / WhatsApp Meta Tags (Redes Sociais) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wdcom-interactive-landing.vercel.app/">
  <meta property="og:title" content="WDCOM | Página de Aguarde Interativa para Sites e Eventos" id="og-title">
  <meta property="og:description" content="Página de aguarde interativa, moderna e personalizada para lançamentos de sites, marcas e grandes eventos. Desenvolvido por WDCOM Mídia Digital." id="og-description">
  <meta property="og:image" content="https://wdcom-interactive-landing.vercel.app/assets/social-share-logo.png" id="og-image">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="WDCOM Mídia Digital">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://wdcom-interactive-landing.vercel.app/">
  <meta name="twitter:title" content="WDCOM | Página de Aguarde Interativa para Sites e Eventos" id="tw-title">
  <meta name="twitter:description" content="Página de aguarde interativa, moderna e personalizada para lançamentos de sites, marcas e grandes eventos. Desenvolvido por WDCOM Mídia Digital." id="tw-description">
  <meta name="twitter:image" content="https://wdcom-interactive-landing.vercel.app/assets/social-share-logo.png" id="tw-image">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo-mark.png">
  <link rel="apple-touch-icon" href="assets/logo-mark.png">

  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheet (Cache-Busting Version) -->
  <link rel="stylesheet" href="style.css?v=5.3.0">
</head>
<body>

  <!-- Fullscreen Interactive Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Centered Event Logo & Aguarde Status Badge -->
  <main class="wallpaper-wrapper">
    <div class="wallpaper-center-container">
      <img src="assets/logo-mark.png" alt="WDCOM Mídia Digital" class="wallpaper-logo" id="wallpaper-logo">
      <div class="wallpaper-status-badge" id="wallpaper-status" style="display: none;">
        <span class="badge-pulse-dot"></span>
        <span class="badge-text" id="status-text">AGUARDE</span>
      </div>
    </div>
  </main>

  <!-- Controls Bar (Exibida APENAS na Página Inicial) -->
  <div class="minimal-controls" id="controls-bar">
    <div class="control-actions">
      <!-- Fullscreen Toggle -->
      <button class="icon-btn" id="fullscreen-btn" title="Tela Cheia (Fullscreen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>

      <!-- Shockwave Trigger -->
      <button class="icon-btn" id="pulse-btn" title="Disparar Onda de Impacto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </button>

      <!-- Color Swatches -->
      <div class="swatch-list">
        <div class="swatch active" data-palette="wdcom" style="background: #00c3ff;" title="WDCOM Teal"></div>
        <div class="swatch" data-palette="black" style="background: #000000; border: 1px solid #444;" title="Tela Preta (OLED Black)"></div>
        <div class="swatch" data-palette="cyber" style="background: #ff007f;" title="Cyber Neon"></div>
        <div class="swatch" data-palette="gold" style="background: #ffb703;" title="Midnight Gold"></div>
        <div class="swatch" data-palette="emerald" style="background: #00e676;" title="Emerald Matrix"></div>
      </div>
    </div>
  </div>

  <!-- Scripts (Cache-Busting Version) -->
  <script src="canvas-background.js?v=5.3.0"></script>
  <script src="main.js?v=5.3.0"></script>
</body>
</html>
